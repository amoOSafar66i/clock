<!DOCTYPE html>
<html>
<head>
    <title>Text Cleaner</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>

    <div class="container">

        <h2>Text Cleaner</h2>

        <p>Enter your messy text below</p>

        <form id="myForm">

            <textarea id="textInput" name="Write your text here..."></textarea>

            <button type="submit">Clean Text</button>

        </form>

        <div class="result-box">
            <h3>Result:</h3>
            <p id="result"></p>
        </div>

    </div>

    <script src="js/app.js"></script>

</body>
</html>
